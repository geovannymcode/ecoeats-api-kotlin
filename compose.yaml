services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecoeats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoeats"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: ecoeats-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/minio
      target: server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      org.springframework.boot.ignore: true
  minio-init:
    image: ecoeats-minio-mc:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ./docker/minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/ecoeats-local"
    labels:
      org.springframework.boot.ignore: true
volumes:
  minio-data:
