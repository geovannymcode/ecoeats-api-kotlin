spring:
  application:
    name: ecoeats-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecoeats}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
server:
  port: ${PORT:8080}
  shutdown: graceful
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
ecoeats:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:24h}
  mail:
    resend:
      api-key: ${RESEND_API_KEY:}
      from-email: ${RESEND_FROM_EMAIL}
      from-name: ${RESEND_FROM_NAME:EcoEats}
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
