<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Recuperación de contraseña</title></head>
<body style="margin:0;padding:32px 16px;background:#f4f7f5;font-family:Arial,sans-serif;color:#26352d;">
  <table role="presentation" style="width:100%;max-width:560px;margin:auto;background:#fff;border-radius:12px;"><tr><td style="padding:36px;text-align:center;">
    <h1 style="color:#2d6a4f;font-size:26px;margin:0 0 24px;">EcoEats</h1>
    <h2 style="font-size:20px;color:#2d6a4f;">Recupera tu contraseña</h2>
    <p>Usa este código para restablecer tu contraseña:</p>
    <div style="font-size:36px;font-weight:bold;letter-spacing:10px;color:#2d6a4f;background:#edf5ef;border-radius:8px;padding:24px 12px;margin:24px 0;">{{otp}}</div>
    <p>El código expira en <strong>15 minutos</strong>.</p>
    <p style="font-size:14px;color:#65756a;">Si no solicitaste este cambio, ignora este correo. No compartas este código.</p>
  </td></tr></table>
</body>
</html>
