        '403':
          content:
            application/json:
              examples:
                example1:
                  summary: Acceso denegado
                  value:
                    data: null
                    message: Acceso denegado
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Acceso denegado
          headers:
            X-Request-Id:
              description: Identificador de solicitud
              schema:
                type: string
        '404':
          content:
            application/json:
              examples:
                example1:
                  summary: Plato no encontrado
                  value:
                    data: null
                    message: Plato no encontrado
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Plato no encontrado
          headers:
            X-Request-Id:
              description: Identificador de solicitud
              schema:
                type: string
        '429':
          content:
            application/json:
              examples:
                example1:
                  summary: Demasiadas solicitudes, intenta más tarde
                  value:
                    data: null
                    message: Demasiadas solicitudes, intenta más tarde
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Demasiadas solicitudes, intenta más tarde
          headers:
            Retry-After:
              description: Segundos hasta el siguiente intento
              schema:
