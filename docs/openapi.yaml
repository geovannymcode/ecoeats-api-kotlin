              examples:
                example1:
                  summary: Tipo de contenido no soportado
                  value:
                    data: null
                    message: Tipo de contenido no soportado
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Tipo de contenido no soportado
          headers:
            X-Request-Id:
              description: Identificador de solicitud
              schema:
                type: string
        '429':
          content:
            application/json:
              examples:
                example1:
                  summary: Demasiadas solicitudes, intenta más tarde
                  value:
                    data: null
                    message: Demasiadas solicitudes, intenta más tarde
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Demasiadas solicitudes, intenta más tarde
          headers:
            Retry-After:
              description: Segundos hasta el siguiente intento
              schema:
                format: int32
                minimum: 1
                type: integer
            X-Request-Id:
              description: Identificador de solicitud
              schema:
                type: string
        '500':
          content:
            application/json:
              examples:
                example1:
                  summary: Error interno del servidor
                  value:
                    data: null
                    message: Error interno del servidor
                    success: false
                    timestamp: '2026-10-09T12:00:00Z'
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Error interno del servidor
          headers:
            X-Request-Id:
              description: Identificador de solicitud
              schema:
                type: string
      security:
      - bearerAuth: []
      summary: Crear plato
      tags:
      - Platos
  /api/dish/{id}:
    delete:
      description: JWT, solo ADMIN. Devuelve data:null. Las imágenes del bucket se borran después del commit; no borra URLs
        externas.
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                example1:
                  summary: Plato eliminado correctamente
                  value:
                    data: null
                    message: Plato eliminado correctamente
                    success: true
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'
          description: Plato eliminado correctamente
          headers:
            X-Request-Id:
